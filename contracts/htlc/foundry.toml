[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 256 }

[lint]
# block-timestamp: the HTLC's whole purpose is a block.timestamp comparison (CLTV-equivalent).
# missing-events-access-control: `lock` does emit `Locked` for the same write, just later in
# the function, after the external token transfer (checks-effects-interactions).
exclude_lints = ["block-timestamp", "missing-events-access-control"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
