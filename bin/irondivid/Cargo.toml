[package]
license = "AGPL-3.0-only"
name = "irondivid"
version.workspace = true
edition.workspace = true
description = "IronDivi daemon - Rust implementation of Divi node"

[[bin]]
name = "irondivid"
path = "src/main.rs"

[[test]]
name = "regtest_log_symmetry_canary"
harness = false

[dependencies]
chrono = { workspace = true }
# Internal crates
divi-node = { workspace = true }
divi-network = { workspace = true }
divi-rpc = { workspace = true }
divi-storage = { workspace = true }
divi-primitives = { workspace = true }
divi-settings = { workspace = true }
divi-wallet = { workspace = true }
divi-crypto = { workspace = true }
divi-masternode = { workspace = true }
divi-webui = { workspace = true }
divi-electrum = { workspace = true }

# CLI
clap = { version = "4.4", features = ["derive"] }
base64 = "0.22"
hex = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
tempfile = { workspace = true }

# Daemonization (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1.4.8"

# Utilities
dirs = "5.0"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
toml = "0.8"

# --features sidechains: the sidechain market (bshuler/irondivi-sidechain-market),
# pinned to one commit
axum = { workspace = true, optional = true }
irondivi-sidechains = { git = "ssh://git@github.com/bshuler/irondivi-sidechain-market.git", rev = "52fbd26928e6417ab9980863aa99de4e3b24392c", optional = true }
dvsm-manifest = { git = "ssh://git@github.com/bshuler/irondivi-sidechain-market.git", rev = "52fbd26928e6417ab9980863aa99de4e3b24392c", optional = true }
dvsc-registry = { git = "ssh://git@github.com/bshuler/irondivi-sidechain-market.git", rev = "52fbd26928e6417ab9980863aa99de4e3b24392c", optional = true }

[features]
fault-injection = ["divi-storage/fault-injection"]
# Off by default: the Sidechains page answers 503 not_installed without it
sidechains = ["dep:axum", "dep:irondivi-sidechains", "dep:dvsm-manifest", "dep:dvsc-registry"]

[dev-dependencies]
divi-diag = { workspace = true }
divi-test-support = { workspace = true }
rocksdb = { workspace = true }
tempfile = { workspace = true }
# tests/electrum.rs: a TLS client and Electrum's script hash
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = { workspace = true }
# tests/electrum.rs: a WebSocket client
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
