[package]
license = "AGPL-3.0-only"
name = "swap-chain-xmr"
version = "0.2.5"
edition = "2021"
description = "DIVI-side presigned 2-of-2 multisig skeleton for the DIVI<->XMR adaptor-signature swap (docs/plans/swap-poc/xmr-design.md)"

[features]
# Integration tests against a public Monero stagenet node, read-only
# (cargo test -p swap-chain-xmr --features live)
live = []

[dependencies]
divi-primitives = { workspace = true }
divi-crypto = { workspace = true }
divi-script = { workspace = true }
divi-wallet = { workspace = true }
divi-swap = { workspace = true }
swap-adaptor = { path = "../swap-adaptor" }
thiserror = { workspace = true }
zeroize = { workspace = true }
dkg = "0.6"
# "ed25519" is the real Monero-compatible ciphersuite; exposes ciphersuite::Ed25519.
ciphersuite = { version = "0.4", features = ["ed25519"] }

[dev-dependencies]
rand = { workspace = true }
dkg-pedpop = "0.6"
rand_core = { version = "0.6", features = ["getrandom"] }
# dkg-pedpop 0.6.0 uses multiexp::BatchVerifier without requesting multiexp's "batch"
# feature itself (upstream packaging gap); pull it in ourselves so Cargo's feature
# unification covers dkg-pedpop's otherwise-unresolved import.
multiexp = { version = "0.4", features = ["batch"] }
# schnorr-signatures 0.5.3 widened its multiexp requirement to ">=0.4.2, <=0.5", which
# Cargo resolves as a separate 0.5.x instance alongside everyone else's strict "^0.4" --
# two incompatible copies of multiexp::BatchVerifier in one build. Pin the last version
# before that widening so the whole tree agrees on 0.4.x.
schnorr-signatures = "=0.5.2"
curve25519-dalek = "4"
monero-wallet = "0.2"
monero-daemon-rpc = "0.2"
monero-simple-request-rpc = "0.1"
tokio = { workspace = true }
