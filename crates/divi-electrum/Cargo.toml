[package]
license = "AGPL-3.0-only"
name = "divi-electrum"
version.workspace = true
edition.workspace = true
description = "IronDivi's optional Electrum protocol server (-electrum)"

[dependencies]
divi-primitives = { workspace = true }
divi-crypto = { workspace = true }
divi-storage = { workspace = true }
divi-rpc = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
anyhow = { workspace = true }
# WebSocket framing for -electrumws / -electrumwss; the version axum already pulls in
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# TLS for -electrumtls; ring keeps the build free of a C/cmake toolchain
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
