[package]
license = "AGPL-3.0-only"
name = "swap-chain-ltc"
version.workspace = true
edition.workspace = true
description = "Atomic swap ChainBackend for Litecoin (testnet) over Esplora HTTP"

[features]
default = ["consensus"]
# libbitcoinconsensus self-checks of every signed spend (C++; off for wasm32)
consensus = ["bitcoin/bitcoinconsensus"]
# Integration tests against the live testnet (cargo test -p swap-chain-ltc --features live -- --ignored)
live = []

[dependencies]
divi-swap = { workspace = true }
bitcoin = { workspace = true }
bech32 = "0.11"
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
wiremock = { workspace = true }
proptest = { workspace = true }
