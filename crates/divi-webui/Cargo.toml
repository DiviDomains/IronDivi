[package]
license = "AGPL-3.0-only"
name = "divi-webui"
version.workspace = true
edition.workspace = true
description = "IronDivi's optional web interface (-webui)"

[dependencies]
divi-crypto = { workspace = true }
divi-rpc = { workspace = true }
divi-electrum = { workspace = true }
divi-wallet = { workspace = true }
divi-primitives = { workspace = true }
divi-script = { workspace = true }

axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
anyhow = { workspace = true }
# The admin password's hash, as the wallet's passphrase key (raw Argon2id)
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
# The interface wallets' sealed words
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# The NFT page's calls to the testnet NFT service (`/api/nft/`)
reqwest = { workspace = true }
# The config file is edited in place, its comments and order kept
toml_edit = "0.22"
base64 = "0.22"
hkdf = "0.12"
ciborium = "0.2"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
