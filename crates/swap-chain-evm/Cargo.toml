[package]
license = "AGPL-3.0-only"
name = "swap-chain-evm"
version.workspace = true
edition.workspace = true
description = "Atomic swap HTLC for ERC-20 (USDC) on EVM testnets (Sepolia, Base Sepolia)"

[features]
# Integration tests against the live testnet (cargo test -p swap-chain-evm --features live -- --ignored)
live = []

[dependencies]
alloy = { version = "2.5.0", features = ["full", "node-bindings"] }
divi-swap = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
secp256k1.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
