[package]
license = "AGPL-3.0-only"
name = "divi-network"
version.workspace = true
edition.workspace = true
description = "P2P network protocol implementation for Divi"

[dependencies]
divi-primitives = { workspace = true }
divi-crypto = { workspace = true }
divi-storage = { workspace = true }
divi-masternode = { workspace = true }
divi-script = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
byteorder = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
sha2 = { workspace = true }
divi-consensus = { workspace = true }

[features]
# Lets sign_hybrid_spork_lms / attach_lms_signature consume LMS leaves from an in-memory
# counter. Test-only, like divi-crypto's feature of the same name: no shipped binary may
# enable it (tools/release-check.sh).
lms-volatile-test-signer = ["divi-crypto/lms-volatile-test-signer"]

[dev-dependencies]
divi-crypto = { workspace = true, features = ["lms-volatile-test-signer"] }
divi-test-support = { workspace = true }
tempfile = { workspace = true }
tokio-test = "0.4"
proptest = { workspace = true }
tracing-subscriber = { workspace = true }
