# cargo deny check: run by tools/release-check.sh before every release build.
# A known vulnerability, a license outside the list below or a crate from an
# unknown source fails the check.

[graph]
# Release builds use default features; the swap crates' `live` features are
# not released.
all-features = false

[advisories]
version = 2
# Unmaintained or yanked crates are reported but do not stop a release; known
# vulnerabilities always do. cargo audit (without --deny warnings) applies the
# same policy.
unmaintained = "none"
yanked = "warn"
ignore = [
    # cggmp21 is used only by divi-swap-xmr, and only for its re-exported Paillier
    # and generic-ec types; the CGGMP21 presigning protocol this advisory covers is
    # never called. It is not linked into irondivid or irondivi-cli. Kept in step
    # with .cargo/audit.toml.
    { id = "RUSTSEC-2025-0127", reason = "presigning protocol never called; swap-xmr only" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Zlib",
    "OpenSSL",
    "0BSD",
    "Unlicense",
    "MITNFA",
    "CDLA-Permissive-2.0",
    # rug and gmp-mpfr-sys (GMP bindings); LGPL-3.0 may be linked into AGPL-3.0 code
    "LGPL-3.0-or-later",
    # The workspace's own license
    "AGPL-3.0-only",
]

[licenses.private]
# The workspace crates are not published
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
