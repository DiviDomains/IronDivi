# diag.irondivi.com: the IronDivi diag receiver (IronDivi docs/plans/diag.md §9).
# Privacy: no access log; the error log is at `emerg`, so per-connection
# errors (which nginx logs at `crit` and below, with the client address)
# are not written. The client address goes to the receiver in X-Diag-Peer
# for the in-memory rate limit only; the receiver never writes it.
server {
    listen 80;
    listen [::]:80;
    server_name diag.irondivi.com;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/diag.irondivi.com.error.log emerg;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name diag.irondivi.com;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/diag.irondivi.com.error.log emerg;

    ssl_certificate /etc/letsencrypt/live/diag.irondivi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diag.irondivi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    # 110 MiB outer cap; the receiver itself enforces the 100 MiB package cap
    client_max_body_size 110m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8795;
        proxy_http_version 1.1;
        # stream the body to the receiver; nginx keeps no temp copy on disk
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Diag-Peer $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
    }
}
