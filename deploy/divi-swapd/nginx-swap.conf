# Include inside the existing dnsdivi `server { ... }` block, e.g.
#   include /etc/nginx/snippets/divi-swapd.conf;
# divi-swapd listens on 127.0.0.1:18480 only.
#
# Optional per-IP limit in nginx, in front of the daemon's own buckets (routes.rs
# *_LIMIT_PER_WINDOW). limit_req_zone belongs in the `http { }` block (e.g.
# /etc/nginx/conf.d/divi-swapd-limit.conf), not here; uncomment both lines together.
# 10 r/s with a burst of 40 sits above every daemon bucket (the largest is 600 a minute), so it
# only sheds floods before they reach the daemon; an honest taker never meets it.
#   limit_req_zone $binary_remote_addr zone=divi_swapd:10m rate=10r/s;
location /swap/ {
    # limit_req zone=divi_swapd burst=40 nodelay;
    # limit_req_status 429;
    proxy_pass http://127.0.0.1:18480/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, never append: the daemon (trust_proxy_headers = true) keys its rate limit on
    # this address, and a client-supplied X-Forwarded-For must not survive.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    # 512 KiB covers 2P-ECDSA Paillier ZK proofs on POST /xmr/swaps/:id/j (~100-250 KiB).
    client_max_body_size 512k;
}

# --- divi-swap landing page (read-only static page; BEGIN) ---
# Exact-match locations beat the /swap/ prefix proxy, so every API path still reaches divi-swapd.
location = /swap/ {
    root /var/www/divi-swap;
    rewrite ^ /index.html break;
    default_type text/html;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
}
location = /swap/landing.js {
    alias /var/www/divi-swap/landing.js;
    default_type application/javascript;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}
location = /swap/landing.css {
    alias /var/www/divi-swap/landing.css;
    default_type text/css;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
}
# --- divi-swap landing page (END) ---
