name: Windows Store MSIX Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publisher:
        description: 'Publisher ID (e.g. CN=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx from Partner Center)'
        required: false
        default: ''
      version:
        description: 'Package Version (Quad format, e.g. 0.2.9.0)'
        required: false
        default: ''

jobs:
  build-msix:
    name: Build Windows MSIX Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Strip private optional sidechain git dependencies for standalone build
        shell: powershell
        run: |
          $cargoToml = "bin/irondivid/Cargo.toml"
          $content = Get-Content $cargoToml -Raw
          $content = $content -replace '(?m)^(irondivi-sidechains|dvsm-manifest|dvsc-registry)\s*=.*\r?\n', ''
          $content = $content -replace 'sidechains\s*=\s*\[[^\]]*\]', 'sidechains = []'
          Set-Content -Path $cargoToml -Value $content -NoNewline

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows binaries
        run: |
          cargo build --release --bin irondivid --bin irondivi-cli
        env:
          RUSTFLAGS: "-C link-arg=/DEBUG:NONE"
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

      - name: Package MSIX & Store Bootstrapper
        shell: powershell
        run: |
          $params = @{
            BinDir = "target/release"
            Sign = $true
          }
          if ("${{ github.event.inputs.publisher }}" -ne "") {
            $params["Publisher"] = "${{ github.event.inputs.publisher }}"
          }
          if ("${{ github.event.inputs.version }}" -ne "") {
            $params["Version"] = "${{ github.event.inputs.version }}"
          }
          ./deploy/windows/scripts/build-msix.ps1 @params

      - name: Upload MSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IronDivi-Windows-MSIX
          path: |
            target/msix/*.exe
            target/msix/*.msix
            target/msix/*.zip
            target/msix/*.cer
            target/msix/*.sha256
            target/msix/SHA256SUMS-windows.txt

      - name: Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/msix/irondivi-x86_64-windows-installer.exe
            target/msix/irondivi-x86_64-windows.msix
            target/msix/irondivi-x86_64-windows.zip
            target/msix/IronDivi-*.msix
            target/msix/*.sha256
            target/msix/SHA256SUMS-windows.txt
