name: Windows Store MSIX Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publisher:
        description: 'Publisher ID (e.g. CN=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx from Partner Center)'
        required: false
        default: ''
      version:
        description: 'Package Version (Quad format, e.g. 0.2.9.0)'
        required: false
        default: ''

jobs:
  build-msix:
    name: Build Windows MSIX Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Windows binaries
        run: |
          cargo build --release --locked --bin irondivid --bin irondivi-cli
        env:
          RUSTFLAGS: "-C link-arg=/DEBUG:NONE"

      - name: Package MSIX
        shell: powershell
        run: |
          $params = @{
            BinDir = "target/release"
            Sign = $true
          }
          if ("${{ github.event.inputs.publisher }}" -ne "") {
            $params["Publisher"] = "${{ github.event.inputs.publisher }}"
          }
          if ("${{ github.event.inputs.version }}" -ne "") {
            $params["Version"] = "${{ github.event.inputs.version }}"
          }
          ./deploy/windows/scripts/build-msix.ps1 @params

      - name: Upload MSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IronDivi-Windows-MSIX
          path: |
            target/msix/*.msix
            target/msix/*.sha256
            target/msix/*.pfx

      - name: Release Asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/msix/*.msix
            target/msix/*.sha256
